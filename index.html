<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ערעור על ציון הגשה — מדעי המחשב</title>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent:  #0891B2;
      --accent-light: #E0F2FE;
      --text:    #111111;
      --muted:   #6B7280;
      --border:  #E5E7EB;
      --bg:      #F9FAFB;
      --white:   #FFFFFF;
      --danger:  #DC2626;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Heebo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
    }

    .page {
      max-width: 580px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    /* ── Header ── */
    .header {
      margin-bottom: 32px;
    }

    .subject-tag {
      display: inline-block;
      background: var(--accent-light);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 4px;
      margin-bottom: 12px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: var(--text);
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Card ── */
    .card {
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    /* ── Form groups ── */
    .form-group {
      margin-bottom: 24px;
    }

    .form-group:last-of-type {
      margin-bottom: 0;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    label .req { color: var(--danger); margin-right: 2px; }

    input[type="text"],
    input[type="number"],
    textarea {
      width: 100%;
      background: var(--white);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Heebo', sans-serif;
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
      direction: rtl;
      appearance: none;
      -webkit-appearance: none;
    }

    input[type="text"]:focus,
    input[type="number"]:focus,
    textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(8,145,178,0.12);
    }

    textarea {
      resize: vertical;
      min-height: 110px;
      line-height: 1.6;
    }

    .hint {
      font-size: 12px;
      color: var(--muted);
      margin-top: 5px;
    }

    /* ── Grade row ── */
    .grade-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* ── Submit button ── */
    .btn-submit {
      width: 100%;
      padding: 15px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: 'Heebo', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.18s, transform 0.12s;
      min-height: 52px;
      margin-top: 28px;
    }

    .btn-submit:hover { background: #0779A0; }
    .btn-submit:active { transform: scale(0.99); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

    /* ── Error ── */
    .err-msg {
      background: #FEF2F2;
      border: 1px solid #FECACA;
      border-radius: 6px;
      padding: 10px 14px;
      color: var(--danger);
      font-size: 13px;
      margin-top: 20px;
      display: none;
    }
    .err-msg.show { display: block; }

    /* ── Success ── */
    .success-screen {
      display: none;
      text-align: center;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 56px 24px;
    }
    .success-screen.show { display: block; }

    .success-icon {
      width: 72px;
      height: 72px;
      background: var(--accent-light);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px;
    }

    .success-icon svg { width: 36px; height: 36px; }

    .success-screen h2 {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .success-screen p {
      font-size: 14px;
      color: var(--muted);
      line-height: 1.6;
    }

    /* ── Mobile ── */
    @media (max-width: 520px) {
      .page { padding: 20px 12px 48px; }
      .header { margin-bottom: 20px; }
      .header h1 { font-size: 22px; }
      .card { padding: 22px 16px; border-radius: 10px; }
      .grade-row { grid-template-columns: 1fr 1fr; gap: 12px; }
      input[type="text"],
      input[type="number"],
      textarea { font-size: 16px; }
    }

    @media (max-width: 360px) {
      .grade-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page">

  <div class="header">
    <div class="subject-tag">מדעי המחשב</div>
    <h1>ערעור על ציון הגשה</h1>
    <p>מלא/י את הטופס ואנחנו נבדוק את הבקשה. יש לפרט את הסיבה לבקשה בצורה ברורה.</p>
  </div>

  <div class="card" id="formCard">

    <div class="form-group">
      <label for="fullName">שם מלא <span class="req">*</span></label>
      <input type="text" id="fullName" placeholder="שם פרטי ושם משפחה">
    </div>

    <div class="grade-row">
      <div class="form-group">
        <label for="currentGrade">ציון קיים <span class="req">*</span></label>
        <input type="number" id="currentGrade" min="0" max="100" placeholder="0–100">
      </div>
      <div class="form-group">
        <label for="requestedGrade">ציון מבוקש <span class="req">*</span></label>
        <input type="number" id="requestedGrade" min="0" max="100" placeholder="0–100">
      </div>
    </div>

    <div class="form-group">
      <label for="reason">סיבה לבקשה <span class="req">*</span></label>
      <textarea id="reason" placeholder="פרט/י מדוע לדעתך מגיע ציון גבוה יותר..."></textarea>
    </div>

    <div class="err-msg" id="errMsg">אנא מלא/י את כל השדות הנדרשים</div>

    <button class="btn-submit" id="btnSubmit" onclick="submitForm()">שלח/י בקשה</button>

  </div>

  <div class="success-screen" id="successScreen">
    <div class="success-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="#0891B2" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h2>הבקשה נשלחה!</h2>
    <p>תודה. הבקשה שלך נשמרה ותיבדק בהקדם.</p>
  </div>

</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyFDlBHn07-bzcBGhok5pVsrFsQcvwspYEf8DF8toXFzog-qhkerIbNc361-Xij3W2VAg/exec';

  function val(id) { return document.getElementById(id)?.value.trim() || ''; }

  function validate() {
    const name    = val('fullName');
    const current = val('currentGrade');
    const req     = val('requestedGrade');
    const reason  = val('reason');

    if (!name || !current || !req || !reason) return false;

    const cur = parseInt(current, 10);
    const rq  = parseInt(req, 10);
    if (isNaN(cur) || isNaN(rq) || cur < 0 || cur > 100 || rq < 0 || rq > 100) return false;

    return true;
  }

  function submitForm() {
    const errEl = document.getElementById('errMsg');
    if (!validate()) {
      errEl.classList.add('show');
      return;
    }
    errEl.classList.remove('show');

    const btn = document.getElementById('btnSubmit');
    btn.textContent = 'שולח...';
    btn.disabled = true;

    const fields = {
      sheetName:      'ערעור מדעי המחשב',
      timestamp:      new Date().toLocaleString('he-IL'),
      fullName:       val('fullName'),
      currentGrade:   val('currentGrade'),
      requestedGrade: val('requestedGrade'),
      reason:         val('reason'),
    };

    const iframe = document.createElement('iframe');
    iframe.name = 'submit-target';
    iframe.style.display = 'none';
    document.body.appendChild(iframe);

    const form = document.createElement('form');
    form.method = 'POST';
    form.action = APPS_SCRIPT_URL;
    form.target = 'submit-target';

    Object.entries(fields).forEach(function([k, v]) {
      const input = document.createElement('input');
      input.type = 'hidden';
      input.name = k;
      input.value = v;
      form.appendChild(input);
    });

    document.body.appendChild(form);
    form.submit();

    setTimeout(function() {
      document.getElementById('formCard').style.display = 'none';
      document.getElementById('successScreen').classList.add('show');
      form.remove();
      iframe.remove();
    }, 2500);
  }
</script>

</body>
</html>
